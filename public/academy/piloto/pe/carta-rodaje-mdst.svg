<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Ejemplo de carta de rodaje de MDST</title>
  <desc id="desc">Esquema de la pista 11/29, calles Alfa y Bravo y plataformas de aviación general, pasajeros y carga.</desc>
  <rect width="1200" height="675" fill="#f8fafc"/>
  <rect x="18" y="18" width="1164" height="639" rx="12" fill="none" stroke="#0f172a" stroke-width="4"/>
  <text x="48" y="68" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">MDST · SANTIAGO</text>
  <text x="1150" y="68" text-anchor="end" font-family="Arial, sans-serif" font-size="24" fill="#334155">EJEMPLO DE RODAJE</text>

  <!-- Runway 11/29 -->
  <rect x="120" y="185" width="960" height="72" rx="4" fill="#111827"/>
  <line x1="180" y1="221" x2="1020" y2="221" stroke="#ffffff" stroke-width="5" stroke-dasharray="34 24"/>
  <text x="145" y="235" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">11</text>
  <text x="1027" y="235" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">29</text>

  <!-- Taxiway A -->
  <path d="M245 257 V365 H930 V257" fill="none" stroke="#94a3b8" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="245" cy="304" r="18" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
  <text x="245" y="313" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">A</text>
  <circle cx="930" cy="304" r="18" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
  <text x="930" y="313" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">A</text>

  <!-- Taxiway B -->
  <path d="M560 365 V257" fill="none" stroke="#94a3b8" stroke-width="40" stroke-linecap="round"/>
  <circle cx="560" cy="311" r="18" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
  <text x="560" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">B</text>

  <!-- Aprons -->
  <rect x="165" y="430" width="250" height="120" rx="12" fill="#cbd5e1" stroke="#475569" stroke-width="3"/>
  <rect x="475" y="430" width="250" height="120" rx="12" fill="#cbd5e1" stroke="#475569" stroke-width="3"/>
  <rect x="785" y="430" width="250" height="120" rx="12" fill="#cbd5e1" stroke="#475569" stroke-width="3"/>
  <path d="M290 365 V430 M600 365 V430 M910 365 V430" stroke="#94a3b8" stroke-width="32" stroke-linecap="round"/>

  <text x="290" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">AVIACIÓN GENERAL</text>
  <text x="290" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#334155">Plataforma</text>
  <text x="600" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">PASAJEROS</text>
  <text x="600" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#334155">Terminal</text>
  <text x="910" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">CARGA</text>
  <text x="910" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#334155">Plataforma</text>

  <!-- Holding points -->
  <g stroke="#dc2626" stroke-width="5">
    <line x1="215" y1="274" x2="275" y2="274"/>
    <line x1="215" y1="284" x2="275" y2="284"/>
    <line x1="530" y1="274" x2="590" y2="274"/>
    <line x1="530" y1="284" x2="590" y2="284"/>
    <line x1="900" y1="274" x2="960" y2="274"/>
    <line x1="900" y1="284" x2="960" y2="284"/>
  </g>
  <text x="60" y="620" font-family="Arial, sans-serif" font-size="20" fill="#475569">Esquema didáctico para identificar pista, calles de rodaje, plataformas y puntos de espera.</text>
</svg>